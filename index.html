<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SHOHIN TRAVEL — Путешествуй по Таджикистану</title>
<style>
/* =========================================================
   SHOHIN TRAVEL — design tokens
   Palette inspired by Tajik landscape & ikat textiles:
   deep pine green (mountains/valleys) + apricot gold (national fruit, sun)
   ========================================================= */
:root{
  --pine-950:#0B2A20;
  --pine-800:#123C2C;
  --pine-700:#175038;
  --pine-600:#1E6A48;
  --pine-500:#278A5B;
  --pine-100:#E4F1EA;
  --gold-600:#C6852B;
  --gold-500:#E3A438;
  --gold-300:#F3D08D;
  --cream:#FBF8F2;
  --cream-2:#F3EEE2;
  --ink:#16241C;
  --ink-soft:#4B5E52;
  --line:#E4DFD2;
  --white:#FFFFFF;
  --danger:#C1462E;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
  --shadow-sm:0 2px 8px rgba(11,42,32,0.08);
  --shadow-md:0 8px 24px rgba(11,42,32,0.12);
  --shadow-lg:0 16px 40px rgba(11,42,32,0.20);
  --font-display: "Iowan Old Style","Georgia","Noto Serif",serif;
  --font-body: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}

*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:var(--font-body);
  background:var(--cream);
  color:var(--ink);
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; border:none; background:none; cursor:pointer;}
input{font-family:inherit;}
img,svg{display:block;}
a{color:inherit; text-decoration:none;}
::-webkit-scrollbar{display:none;}
*{scrollbar-width:none;}

#app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  background:var(--cream);
  position:relative;
  padding-bottom:86px;
}

/* ---------- Eyebrow / labels ---------- */
.eyebrow{
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  font-weight:700;
  color:var(--gold-600);
}
.section{padding:22px 18px 4px;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px;}
.section-title{font-family:var(--font-display); font-size:20px; font-weight:700; color:var(--pine-900,var(--pine-800)); letter-spacing:.01em;}
.section-link{font-size:12.5px; font-weight:600; color:var(--pine-600);}

/* ---------- Header ---------- */
.header{
  background:linear-gradient(180deg, var(--pine-800) 0%, var(--pine-700) 62%, var(--pine-600) 100%);
  color:var(--cream);
  padding:18px 18px 34px;
  position:relative;
  overflow:hidden;
  border-radius:0 0 28px 28px;
}
.header-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; position:relative; z-index:2;}
.logo{display:flex; align-items:center; gap:9px;}
.logo-mark{
  width:36px; height:36px; border-radius:11px;
  background:linear-gradient(145deg, var(--gold-500), var(--gold-600));
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:17px; color:var(--pine-900,var(--pine-800));
  box-shadow:var(--shadow-sm);
}
.logo-text{font-family:var(--font-display); font-weight:700; font-size:16.5px; letter-spacing:.02em; line-height:1;}
.logo-text small{display:block; font-family:var(--font-body); font-weight:600; font-size:9px; letter-spacing:.16em; color:var(--gold-300); margin-top:3px;}
.header-icon-btn{
  width:38px; height:38px; border-radius:50%;
  background:rgba(255,255,255,0.12);
  display:flex; align-items:center; justify-content:center;
  font-size:17px; color:var(--cream);
}
.header-title{
  font-family:var(--font-display);
  font-size:25px; line-height:1.28; font-weight:700;
  position:relative; z-index:2; max-width:280px;
  margin-bottom:16px;
}
.header-sub{font-size:13px; color:var(--pine-100); opacity:.85; margin-top:6px; max-width:270px;}

/* mountain ridge signature motif */
.ridge{
  position:absolute; left:0; right:0; bottom:0; height:64px;
  z-index:1; opacity:.9;
}

.search-bar{
  display:flex; align-items:center; gap:10px;
  background:var(--white);
  border-radius:16px;
  padding:13px 15px;
  box-shadow:var(--shadow-md);
  position:relative; z-index:2;
}
.search-bar input{
  border:none; outline:none; flex:1; font-size:14.5px; color:var(--ink); background:none;
}
.search-bar input::placeholder{color:#9AA79E;}
.search-icon{font-size:16px; opacity:.55;}
.search-clear{font-size:13px; color:var(--ink-soft); display:none;}

/* ---------- Category chips ---------- */
.chip-row{display:flex; gap:9px; overflow-x:auto; padding:2px 18px 6px; scroll-snap-type:x proximity;}
.chip{
  flex:0 0 auto; scroll-snap-align:start;
  display:flex; align-items:center; gap:6px;
  padding:9px 15px; border-radius:999px;
  background:var(--white); border:1px solid var(--line);
  font-size:13px; font-weight:600; color:var(--ink-soft);
  white-space:nowrap;
}
.chip.active{background:var(--pine-700); border-color:var(--pine-700); color:var(--white); box-shadow:var(--shadow-sm);}

/* ---------- Horizontal city rail ---------- */
.rail{display:flex; gap:13px; overflow-x:auto; padding:2px 18px 10px;}
.city-card{
  flex:0 0 auto; width:146px;
  background:var(--white); border-radius:var(--radius-md);
  box-shadow:var(--shadow-sm); overflow:hidden;
  border:1px solid var(--line);
}
.city-card .thumb{
  height:96px; display:flex; align-items:center; justify-content:center;
  font-size:34px; position:relative;
}
.city-card .thumb .fav-dot{
  position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:50%;
  background:rgba(255,255,255,0.85); display:flex; align-items:center; justify-content:center; font-size:13px;
}
.city-card .body{padding:10px 11px 12px;}
.city-card .name{font-weight:700; font-size:14px; color:var(--ink); margin-bottom:2px;}
.city-card .region{font-size:11px; color:var(--ink-soft);}

/* ---------- Place grid ---------- */
.grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:2px 18px 6px;}
.place-card{
  background:var(--white); border-radius:var(--radius-md); overflow:hidden;
  box-shadow:var(--shadow-sm); border:1px solid var(--line);
}
.place-card .thumb{height:88px; display:flex; align-items:center; justify-content:center; font-size:30px; position:relative;}
.place-card .cat-tag{
  position:absolute; left:8px; top:8px; background:rgba(11,42,32,0.55); color:var(--white);
  font-size:9.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
  padding:3px 7px; border-radius:999px;
}
.place-card .body{padding:9px 10px 11px;}
.place-card .name{font-weight:700; font-size:13px; line-height:1.25; margin-bottom:3px;}
.place-card .loc{font-size:10.5px; color:var(--ink-soft); margin-bottom:6px;}
.place-card .meta{display:flex; align-items:center; justify-content:space-between;}
.rating{font-size:11.5px; font-weight:700; color:var(--gold-600); display:flex; align-items:center; gap:3px;}
.price-tag{font-size:11px; font-weight:600; color:var(--pine-700);}

.list-row{
  display:flex; gap:12px; background:var(--white); border-radius:var(--radius-md);
  border:1px solid var(--line); box-shadow:var(--shadow-sm); padding:10px; margin:0 18px 12px;
}
.list-row .thumb{width:64px; height:64px; border-radius:12px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:26px;}
.list-row .info{flex:1; min-width:0;}
.list-row .name{font-weight:700; font-size:14px; margin-bottom:2px;}
.list-row .loc{font-size:11.5px; color:var(--ink-soft); margin-bottom:5px;}

.empty-state{padding:40px 24px; text-align:center; color:var(--ink-soft);}
.empty-state .glyph{font-size:34px; margin-bottom:10px;}
.empty-state .txt{font-size:13.5px; line-height:1.5;}

/* ---------- Ad slots ---------- */
.ad-slot{
  margin:2px 18px 16px;
  border-radius:var(--radius-md);
  border:1.5px dashed var(--gold-500);
  background:linear-gradient(135deg, var(--gold-300) 0%, var(--cream-2) 130%);
  padding:13px 14px;
  display:flex; align-items:center; gap:12px;
}
.ad-slot .ad-icon{width:44px; height:44px; border-radius:12px; background:var(--white); display:flex; align-items:center; justify-content:center; font-size:20px; flex:0 0 auto;}
.ad-slot .ad-body{flex:1; min-width:0;}
.ad-slot .ad-label{font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--gold-600);}
.ad-slot .ad-title{font-size:13.5px; font-weight:700; color:var(--ink); margin-top:2px;}
.ad-slot .ad-desc{font-size:11.5px; color:var(--ink-soft); margin-top:1px;}

/* ---------- Bottom nav ---------- */
.bottom-nav{
  position:fixed; left:0; right:0; bottom:0;
  max-width:480px; margin:0 auto;
  background:rgba(251,248,242,0.96);
  backdrop-filter:blur(6px);
  border-top:1px solid var(--line);
  display:flex;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  z-index:40;
}
.nav-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:6px 2px; color:var(--ink-soft); font-size:10.5px; font-weight:600; position:relative;
}
.nav-btn .ic{font-size:19px;}
.nav-btn.active{color:var(--pine-700);}
.nav-badge{
  position:absolute; top:0; right:22%; min-width:15px; height:15px; border-radius:999px;
  background:var(--danger); color:#fff; font-size:9px; font-weight:700;
  display:flex; align-items:center; justify-content:center; padding:0 3px;
}

/* ---------- Views ---------- */
.view{display:none;}
.view.active{display:block;}

.page-head{padding:18px 18px 6px; display:flex; align-items:center; gap:12px;}
.back-btn{width:34px; height:34px; border-radius:50%; background:var(--white); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:16px;}
.page-head .title{font-family:var(--font-display); font-size:19px; font-weight:700;}

.search-full{margin:10px 18px 4px;}

/* ---------- Profile ---------- */
.profile-hero{padding:22px 18px 6px; display:flex; align-items:center; gap:13px;}
.avatar{width:56px; height:56px; border-radius:50%; background:linear-gradient(145deg,var(--gold-500),var(--gold-600)); display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--pine-900,var(--pine-800));}
.profile-name{font-family:var(--font-display); font-weight:700; font-size:17px;}
.profile-sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}

.menu-list{margin:14px 18px; background:var(--white); border-radius:var(--radius-md); border:1px solid var(--line); overflow:hidden; box-shadow:var(--shadow-sm);}
.menu-item{display:flex; align-items:center; gap:12px; padding:14px 15px; border-bottom:1px solid var(--line);}
.menu-item:last-child{border-bottom:none;}
.menu-item .ic{width:34px; height:34px; border-radius:10px; background:var(--pine-100); display:flex; align-items:center; justify-content:center; font-size:16px;}
.menu-item .label{flex:1; font-size:14px; font-weight:600;}
.menu-item .val{font-size:12.5px; color:var(--ink-soft);}
.menu-item .chev{color:var(--ink-soft); font-size:14px;}

.lang-row{display:flex; gap:10px; margin:10px 18px 4px;}
.lang-btn{flex:1; padding:11px 6px; border-radius:12px; border:1.5px solid var(--line); background:var(--white); font-size:12.5px; font-weight:700; text-align:center;}
.lang-btn.active{border-color:var(--pine-700); background:var(--pine-700); color:var(--white);}

/* ---------- Trip ---------- */
.trip-item{display:flex; align-items:center; gap:12px; background:var(--white); border:1px solid var(--line); border-radius:var(--radius-md); padding:11px; margin:0 18px 10px; box-shadow:var(--shadow-sm);}
.trip-item .idx{width:24px; height:24px; border-radius:50%; background:var(--pine-100); color:var(--pine-700); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
.trip-item .thumb{width:48px; height:48px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; flex:0 0 auto;}
.trip-item .info{flex:1; min-width:0;}
.trip-item .name{font-weight:700; font-size:13.5px;}
.trip-item .loc{font-size:11px; color:var(--ink-soft);}
.trip-item .rm{font-size:18px; color:var(--ink-soft); padding:4px 6px;}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:13px 18px; border-radius:14px; font-weight:700; font-size:14px;
}
.btn-primary{background:var(--pine-700); color:var(--white); box-shadow:var(--shadow-sm);}
.btn-ghost{background:var(--white); color:var(--pine-700); border:1.5px solid var(--pine-700);}
.btn-block{width:calc(100% - 36px); margin:6px 18px 18px;}
.btn-danger-ghost{color:var(--danger); border-color:var(--danger); background:var(--white); border:1.5px solid var(--danger);}

/* ---------- Modal (place detail) ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(11,42,32,0.45);
  display:none; align-items:flex-end; justify-content:center; z-index:100;
}
.overlay.open{display:flex;}
.sheet{
  width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
  background:var(--cream); border-radius:24px 24px 0 0;
  animation:slideUp .22s ease-out;
  padding-bottom:26px;
}
@keyframes slideUp{from{transform:translateY(24px); opacity:.4;} to{transform:translateY(0); opacity:1;}}
.sheet-grabber{width:38px; height:4px; background:var(--line); border-radius:99px; margin:10px auto 0;}
.sheet-hero{
  height:180px; margin:14px 18px 0; border-radius:18px;
  display:flex; align-items:center; justify-content:center; font-size:64px; position:relative;
}
.sheet-close{position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.85); display:flex; align-items:center; justify-content:center; font-size:15px;}
.sheet-cat{position:absolute; left:12px; top:12px; background:rgba(11,42,32,0.6); color:#fff; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:4px 9px; border-radius:999px;}
.sheet-body{padding:16px 18px 0;}
.sheet-title{font-family:var(--font-display); font-size:22px; font-weight:700; margin-bottom:4px;}
.sheet-loc{font-size:13px; color:var(--ink-soft); margin-bottom:12px;}
.sheet-stats{display:flex; gap:8px; margin-bottom:14px;}
.stat-pill{flex:1; background:var(--white); border:1px solid var(--line); border-radius:12px; padding:9px 8px; text-align:center;}
.stat-pill .v{font-weight:700; font-size:13.5px;}
.stat-pill .l{font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin-top:1px;}
.sheet-desc{font-size:13.5px; line-height:1.65; color:var(--ink); margin-bottom:14px;}
.sheet-detail-row{display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--line); font-size:13px;}
.sheet-detail-row .ic{width:20px; flex:0 0 auto;}
.sheet-detail-row .k{color:var(--ink-soft); width:82px; flex:0 0 auto;}
.sheet-map-box{
  margin-top:6px; background:var(--pine-100); border-radius:14px; padding:14px;
  font-size:12px; color:var(--pine-700); line-height:1.55;
}
.sheet-actions{display:flex; gap:9px; padding:16px 18px 0;}
.act-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:11px 4px; border-radius:14px; border:1.5px solid var(--line); background:var(--white);
  font-size:10.5px; font-weight:700; color:var(--ink-soft);
}
.act-btn.on{border-color:var(--gold-600); background:var(--gold-300); color:var(--gold-600);}
.act-btn .ic{font-size:18px;}

/* toast */
.toast{
  position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(20px);
  background:var(--pine-900,var(--pine-800)); color:#fff; font-size:12.5px; font-weight:600;
  padding:10px 18px; border-radius:999px; opacity:0; pointer-events:none; transition:.22s ease;
  z-index:200; max-width:80%; text-align:center; box-shadow:var(--shadow-lg);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

@media (min-width:481px){
  body{background:var(--cream-2);}
  #app{box-shadow:0 0 60px rgba(11,42,32,0.15);}
}
</style>
</head>
<body>

<div id="app">

  <!-- ============================================================
       HOME VIEW
  ============================================================= -->
  <div class="view active" id="view-home">

    <div class="header">
      <div class="header-top">
        <div class="logo">
          <div class="logo-mark">S</div>
          <div class="logo-text">SHOHIN TRAVEL<small data-i18n="tagline">ТАДЖИКИСТАН</small></div>
        </div>
        <button class="header-icon-btn" data-nav="profile">👤</button>
      </div>
      <div class="header-title" data-i18n="homeTitle">Путешествуй по Таджикистану 🇹🇯</div>

      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input id="homeSearch" type="text" data-i18n-ph="searchPh" placeholder="Город, место, категория…">
        <span class="search-clear" id="homeSearchClear">✕</span>
      </div>

      <svg class="ridge" viewBox="0 0 480 64" preserveAspectRatio="none">
        <polygon points="0,64 0,40 60,18 120,36 180,10 250,32 320,14 390,38 440,22 480,40 480,64" fill="#1E6A48" opacity="0.55"/>
        <polygon points="0,64 0,50 70,30 140,46 210,26 280,44 350,28 420,48 480,32 480,64" fill="#175038" opacity="0.75"/>
      </svg>
    </div>

    <div class="chip-row" id="catChips"></div>

    <div id="homeDefaultSections">
      <div class="section">
        <div class="section-head">
          <div class="section-title" data-i18n="popularCities">Популярные города</div>
          <button class="section-link" data-nav="search" data-cat="city" data-i18n="seeAll">Все →</button>
        </div>
      </div>
      <div class="rail" id="citiesRail"></div>

      <div class="ad-slot" id="adSlot1"></div>

      <div class="section">
        <div class="section-head">
          <div class="section-title" data-i18n="interestingPlaces">Интересные места</div>
          <button class="section-link" data-nav="search" data-i18n="seeAll">Все →</button>
        </div>
      </div>
      <div class="grid" id="placesGrid"></div>

      <div class="ad-slot" id="adSlot2"></div>
    </div>

    <div id="homeFilteredSections" style="display:none;"></div>

  </div>

  <!-- ============================================================
       SEARCH / CATEGORY VIEW
  ============================================================= -->
  <div class="view" id="view-search">
    <div class="page-head">
      <div class="title" data-i18n="searchTitle">Поиск и категории</div>
    </div>
    <div class="search-full">
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input id="fullSearch" type="text" data-i18n-ph="searchPh" placeholder="Город, место, категория…">
        <span class="search-clear" id="fullSearchClear">✕</span>
      </div>
    </div>
    <div class="chip-row" id="catChips2"></div>
    <div id="searchResults" style="padding-top:6px;"></div>
  </div>

  <!-- ============================================================
       TRIP VIEW
  ============================================================= -->
  <div class="view" id="view-trip">
    <div class="page-head">
      <div class="title" data-i18n="myTripTitle">🧳 Моя поездка</div>
    </div>
    <div id="tripList"></div>
    <div id="tripActions"></div>
  </div>

  <!-- ============================================================
       PROFILE VIEW
  ============================================================= -->
  <div class="view" id="view-profile">
    <div class="profile-hero">
      <div class="avatar">👤</div>
      <div>
        <div class="profile-name" data-i18n="guestName">Гость</div>
        <div class="profile-sub" data-i18n="noRegister">Без регистрации · офлайн-режим</div>
      </div>
    </div>

    <div class="menu-list">
      <button class="menu-item" data-nav="favorites">
        <div class="ic">❤️</div>
        <div class="label" data-i18n="favorites">Избранное</div>
        <div class="val" id="favCount">0</div>
        <div class="chev">›</div>
      </button>
      <button class="menu-item" data-nav="trip">
        <div class="ic">🧳</div>
        <div class="label" data-i18n="myTrip">Моя поездка</div>
        <div class="val" id="tripCount">0</div>
        <div class="chev">›</div>
      </button>
    </div>

    <div class="section" style="padding-top:6px;">
      <div class="section-title" style="font-size:14px;" data-i18n="language">Язык</div>
    </div>
    <div class="lang-row" id="langRow">
      <button class="lang-btn" data-lang="ru">🇷🇺 Русский</button>
      <button class="lang-btn" data-lang="tj">🇹🇯 Тоҷикӣ</button>
      <button class="lang-btn" data-lang="en">🇬🇧 English</button>
    </div>

    <div class="menu-list" style="margin-top:18px;">
      <div class="menu-item">

    state.favorites = JSON.parse(localStorage.getItem(STORAGE_KEYS.fav) || "[]");
    state.trip = JSON.parse(localStorage.getItem(STORAGE_KEYS.trip) || "[]");
    state.lang = localStorage.getItem(STORAGE_KEYS.lang) || "ru";
  }catch(e){ state.favorites=[]; state.trip=[]; state.lang="ru"; }
}
function saveFavorites(){ localStorage.setItem(STORAGE_KEYS.fav, JSON.stringify(state.favorites)); }
function saveTrip(){ localStorage.setItem(STORAGE_KEYS.trip, JSON.stringify(state.trip)); }
function saveLang(){ localStorage.setItem(STORAGE_KEYS.lang, state.lang); }

/* ================================ HELPERS ================================ */
function t(key){ return (translations[state.lang] && translations[state.lang][key]) || translations.ru[key] || key; }
function findItem(id){ return ALL_ITEMS.find(i => i.id === id); }
function isFav(id){ return state.favorites.includes(id); }
function isInTrip(id){ return state.trip.includes(id); }
function catMeta(catId){ return CATEGORIES.find(c => c.id === catId) || CATEGORIES[0]; }
function itemLocLabel(item){
  if(item.type === "city") return item.region;
  return item.city + " · " + item.region;
}
function showToast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> el.classList.remove("show"), 1700);
}

/* ================================ SEARCH/FILTER ================================ */
function matchesQuery(item, q){
  if(!q) return true;
  q = q.toLowerCase();
  const cat = catMeta(item.category).label.toLowerCase();
  const hay = [
    item.name, item.region || "", item.city || "", item.description || "", cat
  ].join(" ").toLowerCase();
  return hay.includes(q);
}
function filterItems({category, query}){
  return ALL_ITEMS.filter(item=>{
    const catOk = (category === "all") || (item.category === category);
    const qOk = matchesQuery(item, query);
    return catOk && qOk;
  });
}

/* ================================ RENDER: chips ================================ */
function renderChips(){
  [document.getElementById("catChips"), document.getElementById("catChips2")].forEach(row=>{
    row.innerHTML = CATEGORIES.map(c=>`
      <button class="chip ${c.id===state.category?'active':''}" data-cat="${c.id}">
        <span>${c.icon}</span><span>${c.label}</span>
      </button>`).join("");
  });
  document.querySelectorAll(".chip").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.category = btn.dataset.cat;
      renderChips();
      if(state.tab === "home") applyHomeFilterView();
      else renderSearchResults();
    });
  });
}

/* ================================ RENDER: home rails ================================ */
function thumbBg(item, idx){
  const palette = ["#E4F1EA","#F3D08D","#DDEDE3","#F0E2C0","#E9F3EC"];
  return palette[idx % palette.length];
}
function renderCitiesRail(){
  const rail = document.getElementById("citiesRail");
  rail.innerHTML = CITIES.map((c,i)=>`
    <div class="city-card" data-id="${c.id}">
      <div class="thumb" style="background:${thumbBg(c,i)};">
        ${c.icon}
        <div class="fav-dot" data-fav="${c.id}">${isFav(c.id) ? "❤️" : "🤍"}</div>
      </div>
      <div class="body">
        <div class="name">${c.name}</div>
        <div class="region">${c.region}</div>
      </div>
    </div>`).join("");
  bindCardEvents(rail);
}
function renderPlacesGrid(){
  const grid = document.getElementById("placesGrid");
  const items = PLACES.slice(0, 8);
  grid.innerHTML = items.map((p,i)=>`
    <div class="place-card" data-id="${p.id}">
      <div class="thumb" style="background:${thumbBg(p,i)};">
        ${p.icon}
        <div class="cat-tag">${catMeta(p.category).icon} ${catMeta(p.category).label}</div>
      </div>
      <div class="body">
        <div class="name">${p.name}</div>
        <div class="loc">${p.city}</div>
        <div class="meta">
          <div class="rating">⭐ ${p.rating}</div>
          <div class="price-tag">${p.price}</div>
        </div>
      </div>
    </div>`).join("");
  bindCardEvents(grid);
}
function renderAds(){
  const els = [document.getElementById("adSlot1"), document.getElementById("adSlot2"), document.getElementById("adSlot3")];
  els.forEach((el, i)=>{
    const ad = ADS[i % ADS.length];
    if(!el) return;
    el.innerHTML = `
      <div class="ad-icon">${ad.icon}</div>
      <div class="ad-body">
        <div class="ad-label">${t("adLabel")} · SLOT ${i+1}</div>
        <div class="ad-title">${ad.title}</div>
        <div class="ad-desc">${ad.desc}</div>
      </div>`;
  });
}

/* ================================ RENDER: filtered (home search) ================================ */
function applyHomeFilterView(){
  const q = state.query.trim();
  const isFiltering = q.length > 0 || state.category !== "all";
  const def = document.getElementById("homeDefaultSections");
  const filt = document.getElementById("homeFilteredSections");
  const clearBtn = document.getElementById("homeSearchClear");
  clearBtn.style.display = q ? "block" : "none";

  if(!isFiltering){
    def.style.display = "block";
    filt.style.display = "none";
    return;
  }
  def.style.display = "none";
  filt.style.display = "block";
  const results = filterItems({category: state.category, query: q});
  filt.innerHTML = renderResultsList(results, "home-filtered");
  bindCardEvents(filt);
  bindListRowEvents(filt);
}

function renderResultsList(results, ctx){
  if(results.length === 0){
    return `<div class="empty-state">
      <div class="glyph">🧭</div>
      <div class="txt"><b>${t("emptySearch")}</b><br>${t("emptySearchTxt")}</div>
    </div>`;
  }
  return `<div style="padding-top:10px;">` + results.map((item,i)=>`
    <div class="list-row" data-id="${item.id}">
      <div class="thumb" style="background:${thumbBg(item,i)};">${item.icon}</div>
      <div class="info">
        <div class="name">${item.name}</div>
        <div class="loc">${catMeta(item.category).icon} ${catMeta(item.category).label} · ${itemLocLabel(item)}</div>
        <div class="meta">
          <div class="rating">⭐ ${item.rating}</div>
        </div>
      </div>
    </div>`).join("") + `</div>`;
}

/* ================================ RENDER: dedicated search view ================================ */
function renderSearchResults(){
  const q = state.query.trim();
  const results = filterItems({category: state.category, query: q});
  const el = document.getElementById("searchResults");
  el.innerHTML = renderResultsList(results, "search");
  bindListRowEvents(el);
}

/* ================================ RENDER: trip / favorites ================================ */
function renderTrip(){
  const list = document.getElementById("tripList");
  const actions = document.getElementById("tripActions");
  const items = state.trip.map(findItem).filter(Boolean);
  document.getElementById("tripCount").textContent = state.trip.length;
  const badge = document.getElementById("navTripBadge");
  if(state.trip.length > 0){ badge.style.display="flex"; badge.textContent = state.trip.length; }
  else badge.style.display = "none";

  if(items.length === 0){
    list.innerHTML = `<div class="empty-state"><div class="glyph">🧳</div><div class="txt"><b>${t("emptyTrip")}</b><br>${t("emptyTripTxt")}</div></div>`;
    actions.innerHTML = "";
    return;
  }
  list.innerHTML = items.map((item,i)=>`
    <div class="trip-item" data-id="${item.id}">
      <div class="idx">${i+1}</div>
      <div class="thumb" style="background:${thumbBg(item,i)};">${item.icon}</div>
      <div class="info">
        <div class="name">${item.name}</div>
        <div class="loc">${itemLocLabel(item)}</div>
      </div>
      <button class="rm" data-rm-trip="${item.id}">✕</button>
    </div>`).join("");
  actions.innerHTML = `<button class="btn btn-danger-ghost btn-block" id="clearTripBtn">${t("clearTrip")}</button>`;

  list.querySelectorAll("[data-rm-trip]").forEach(btn=>{
    btn.addEventListener("click", (e)=>{ e.stopPropagation(); toggleTrip(btn.dataset.rmTrip); });
  });
  list.querySelectorAll(".trip-item").forEach(row=>{
    row.addEventListener("click", ()=> openSheet(row.dataset.id));
  });
  document.getElementById("clearTripBtn").addEventListener("click", ()=>{
    state.trip = []; saveTrip(); renderTrip(); showToast(t("toastTripCleared"));
  });
}
function renderFavorites(){
  const list = document.getElementById("favList");
  const items = state.favorites.map(findItem).filter(Boolean);
  document.getElementById("favCount").textContent = state.favorites.length;
  if(items.length === 0){
    list.innerHTML = `<div class="empty-state"><div class="glyph">❤️</div><div class="txt"><b>${t("emptyFav")}</b><br>${t("emptyFavTxt")}</div></div>`;
    return;
  }
  list.innerHTML = renderResultsList(items, "fav");
  bindListRowEvents(list);
}

/* ================================ CARD EVENT BINDING ================================ */
function bindCardEvents(container){
  container.querySelectorAll(".city-card, .place-card").forEach(card=>{
    card.addEventListener("click", (e)=>{
      if(e.target.closest("[data-fav]")) return;
      openSheet(card.dataset.id);
    });
  });
  container.querySelectorAll("[data-fav]").forEach(dot=>{
    dot.addEventListener("click",(e)=>{
      e.stopPropagation();
      toggleFav(dot.dataset.fav);
    });
  });
}
function bindListRowEvents(container){
  container.querySelectorAll(".list-row").forEach(row=>{
    row.addEventListener("click", ()=> openSheet(row.dataset.id));
  });
}

/* ================================ FAV / TRIP toggles ================================ */
function toggleFav(id){
  if(isFav(id)){
    state.favorites = state.favorites.filter(x=>x!==id);
    showToast(t("toastRemovedFav"));
  }else{
    state.favorites.push(id);
    showToast(t("toastAddedFav"));
  }
  saveFavorites();
  refreshAllViews();
}
function toggleTrip(id){
  if(isInTrip(id)){
    state.trip = state.trip.filter(x=>x!==id);
    showToast(t("toastRemovedTrip"));
  }else{
    state.trip.push(id);
    showToast(t("toastAddedTrip"));
  }
  saveTrip();
  refreshAllViews();
}

/* ================================ DETAIL SHEET (modal) ================================ */
function openSheet(id){
  const item = findItem(id);
  if(!item) return;
  const sheet = document.getElementById("sheet");
  const cat = catMeta(item.category);
  const isCity = item.type === "city";

  sheet.innerHTML = `
    <div class="sheet-grabber"></div>
    <div class="sheet-hero" style="background:${thumbBg(item,1)};">
      ${item.icon}
      <div class="sheet-cat">${cat.icon} ${cat.label}</div>
      <button class="sheet-close" id="sheetClose">✕</button>
    </div>
    <div class="sheet-body">
      <div class="sheet-title">${item.name}</div>
      <div class="sheet-loc">📍 ${itemLocLabel(item)}</div>
      <div class="sheet-stats">
        <div class="stat-pill"><div class="v">⭐ ${item.rating}</div><div class="l">${t("rating")}</div></div>
        ${!isCity ? `<div class="stat-pill"><div class="v">${item.price}</div><div class="l">${t("price")}</div></div>` : ``}
        ${!isCity ? `<div class="stat-pill"><div class="v" style="font-size:11.5px;">${item.hours}</div><div class="l">${t("hours")}</div></div>` : ``}
      </div>
      <div class="sheet-desc">${item.description}</div>
      ${!isCity ? `
      <div class="sheet-detail-row"><div class="ic">📞</div><div class="k">${t("phone")}</div><div>${item.phone}</div></div>
      ` : ``}
      <div class="sheet-detail-row"><div class="ic">🧭</div><div class="k">GPS</div><div>${item.coords.lat.toFixed(4)}, ${item.coords.lng.toFixed(4)}</div></div>
      <div class="sheet-map-box">🗺️ ${t("mapNote")} <b>${item.coords.lat.toFixed(4)}, ${item.coords.lng.toFixed(4)}</b></div>
    </div>
    <div class="sheet-actions">
      <button class="act-btn ${isInTrip(item.id)?'on':''}" id="sheetTripBtn">
        <div class="ic">🧳</div><div>${isInTrip(item.id) ? t("inTrip") : t("addToTrip")}</div>
      </button>
      <button class="act-btn ${isFav(item.id)?'on':''}" id="sheetFavBtn">
        <div class="ic">${isFav(item.id) ? "❤️" : "🤍"}</div><div>${isFav(item.id) ? t("inFav") : t("addFav")}</div>
      </button>
      <button class="act-btn" id="sheetMapBtn">
        <div class="ic">🗺️</div><div>${t("showMap")}</div>
      </button>
    </div>
  `;

  document.getElementById("sheetClose").addEventListener("click", closeSheet);
  document.getElementById("sheetTripBtn").addEventListener("click", ()=>{ toggleTrip(item.id); openSheet(item.id); });
  document.getElementById("sheetFavBtn").addEventListener("click", ()=>{ toggleFav(item.id); openSheet(item.id); });
  document.getElementById("sheetMapBtn").addEventListener("click", ()=>{
    document.querySelector(".sheet-map-box").scrollIntoView({behavior:"smooth", block:"center"});
  });

  document.getElementById("overlay").classList.add("open");
}
function closeSheet(){ document.getElementById("overlay").classList.remove("open"); }

/* ================================ NAV / TABS ================================ */
function setTab(tab){
  state.tab = tab;
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById("view-" + tab).classList.add("active");
  document.querySelectorAll(".nav-btn").forEach(b=> b.classList.toggle("active", b.dataset.tab === tab));
  if(tab === "search") renderSearchResults();
  if(tab === "trip") renderTrip();
  if(tab === "favorites") renderFavorites();
  window.scrollTo(0,0);
}

/* ================================ LANGUAGE ================================ */
function applyLanguage(){
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{
    el.setAttribute("placeholder", t(el.dataset.i18nPh));
  });
  document.querySelectorAll(".lang-btn").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.lang === state.lang);
  });
}

/* ================================ REFRESH ================================ */
function refreshAllViews(){
  renderCitiesRail();
  renderPlacesGrid();
  if(state.tab === "home") applyHomeFilterView();
  if(state.tab === "search") renderSearchResults();
  if(state.tab === "trip") renderTrip();
  if(state.tab === "favorites") renderFavorites();
  document.getElementById("favCount").textContent = state.favorites.length;
  document.getElementById("tripCount").textContent = state.trip.length;
  const badge = document.getElementById("navTripBadge");
  if(state.trip.length > 0){ badge.style.display="flex"; badge.textContent = state.trip.length; }
  else badge.style.display = "none";
}

/* ================================ EVENTS: global ================================ */
function bindGlobalEvents(){
  document.querySelectorAll("[data-nav]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const target = el.dataset.nav;
      if(el.dataset.cat){ state.category = el.dataset.cat; renderChips(); }
      setTab(target);
    });
  });
  document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.addEventListener("click", ()=> setTab(btn.dataset.tab));
  });

  const homeSearch = document.getElementById("homeSearch");
  homeSearch.addEventListener("input", (e)=>{
    state.query = e.target.value;
    applyHomeFilterView();
  });
  document.getElementById("homeSearchClear").addEventListener("click", ()=>{
    homeSearch.value=""; state.query=""; applyHomeFilterView();
  });

  const fullSearch = document.getElementById("fullSearch");
  fullSearch.addEventListener("input", (e)=>{
    state.query = e.target.value;
    document.getElementById("fullSearchClear").style.display = e.target.value ? "block" : "none";
    renderSearchResults();
  });
  document.getElementById("fullSearchClear").addEventListener("click", ()=>{
    fullSearch.value=""; state.query=""; renderSearchResults();
    document.getElementById("fullSearchClear").style.display = "none";
  });

  document.getElementById("overlay").addEventListener("click", (e)=>{
    if(e.target.id === "overlay") closeSheet();
  });

  document.querySelectorAll(".lang-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.lang = btn.dataset.lang;
      saveLang();
      applyLanguage();
      refreshAllViews();
    });
  });
}

/* ================================ INIT ================================ */
function init(){
  loadStorage();
  renderChips();
  renderCitiesRail();
  renderPlacesGrid();
  renderAds();
  applyLanguage();
  bindGlobalEvents();
  refreshAllViews();
}
init();
</script>
</body>
</html>
