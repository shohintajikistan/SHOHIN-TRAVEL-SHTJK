<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<meta name="theme-color" content="#123C2C">

<meta name="description"
content="SHOHIN TRAVEL SHTJK — путеводитель по Таджикистану">

<title>SHOHIN TRAVEL SHTJK</title>

<style>

:root{
--pine-950:#0B2A20;
--pine-800:#123C2C;
--pine-700:#175038;
--pine-600:#1E6A48;
--pine-500:#278A5B;
--pine-100:#E4F1EA;

--gold-600:#C6852B;
--gold-500:#E3A438;
--gold-300:#F3D08D;

--cream:#FBF8F2;
--cream-2:#F3EEE2;

--ink:#16241C;
--ink-soft:#4B5E52;
--line:#E4DFD2;
--white:#fff;
--danger:#C1462E;

--radius-lg:20px;
--radius-md:14px;
--radius-sm:10px;

--shadow-sm:0 2px 8px rgba(11,42,32,.08);
--shadow-md:0 8px 24px rgba(11,42,32,.12);
--shadow-lg:0 16px 40px rgba(11,42,32,.20);

--font-display:"Iowan Old Style","Georgia","Noto Serif",serif;
--font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif
}

*{
box-sizing:border-box;
margin:0;
padding:0;
-webkit-tap-highlight-color:transparent;
scrollbar-width:none
}

html,body{
min-height:100%
}

body{
font-family:var(--font-body);
background:var(--cream);
color:var(--ink);
overscroll-behavior-y:none;
-webkit-font-smoothing:antialiased
}

button,input,select,textarea{
font-family:inherit
}

button{
border:0;
background:none;
cursor:pointer
}

input{
outline:0
}

a{
text-decoration:none;
color:inherit
}

::-webkit-scrollbar{
display:none
}

#app{
max-width:480px;
min-height:100vh;
margin:auto;
background:var(--cream);
position:relative;
padding-bottom:88px
}

.view{
display:none
}

.view.active{
display:block
}

.eyebrow{
font-size:11px;
letter-spacing:.14em;
text-transform:uppercase;
font-weight:700;
color:var(--gold-600)
}

.section{
padding:22px 18px 4px
}

.section-head{
display:flex;
align-items:baseline;
justify-content:space-between;
margin-bottom:12px
}

.section-title{
font-family:var(--font-display);
font-size:20px;
font-weight:700;
color:var(--pine-800)
}

.section-link{
font-size:12.5px;
font-weight:600;
color:var(--pine-600)
}

/* HEADER */

.header{
background:
linear-gradient(
180deg,
var(--pine-800) 0%,
var(--pine-700) 62%,
var(--pine-600) 100%
);
color:var(--cream);
padding:18px 18px 34px;
position:relative;
overflow:hidden;
border-radius:0 0 28px 28px
}

.header-top{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:16px;
position:relative;
z-index:2
}

.logo{
display:flex;
align-items:center;
gap:9px
}

.logo-mark{
width:36px;
height:36px;
border-radius:11px;
background:linear-gradient(
145deg,
var(--gold-500),
var(--gold-600)
);
display:flex;
align-items:center;
justify-content:center;
font-family:var(--font-display);
font-weight:700;
font-size:17px;
color:var(--pine-800);
box-shadow:var(--shadow-sm)
}

.logo-text{
font-family:var(--font-display);
font-weight:700;
font-size:16px;
letter-spacing:.02em;
line-height:1
}

.logo-text small{
display:block;
font-family:var(--font-body);
font-weight:600;
font-size:9px;
letter-spacing:.14em;
color:var(--gold-300);
margin-top:3px
}

.header-icon-btn{
width:38px;
height:38px;
border-radius:50%;
background:rgba(255,255,255,.12);
display:flex;
align-items:center;
justify-content:center;
font-size:17px;
color:var(--cream)
}

.header-title{
font-family:var(--font-display);
font-size:25px;
line-height:1.28;
font-weight:700;
position:relative;
z-index:2;
max-width:290px;
margin-bottom:16px
}

.ridge{
position:absolute;
left:0;
right:0;
bottom:0;
height:64px;
z-index:1;
opacity:.9
}

/* SEARCH */

.search-bar{
display:flex;
align-items:center;
gap:10px;
background:#fff;
border-radius:16px;
padding:13px 15px;
box-shadow:var(--shadow-md);
position:relative;
z-index:2
}

.search-bar input{
border:0;
flex:1;
font-size:14.5px;
color:var(--ink);
background:transparent
}

.search-bar input::placeholder{
color:#9AA79E
}

.search-icon{
font-size:16px;
opacity:.55
}

.search-clear{
font-size:13px;
color:var(--ink-soft);
display:none
}

/* CHIPS */

.chip-row{
display:flex;
gap:9px;
overflow-x:auto;
padding:12px 18px 6px;
scroll-snap-type:x proximity
}

.chip{
flex:0 0 auto;
display:flex;
align-items:center;
gap:6px;
padding:9px 15px;
border-radius:999px;
background:#fff;
border:1px solid var(--line);
font-size:13px;
font-weight:600;
color:var(--ink-soft);
white-space:nowrap
}

.chip.active{
background:var(--pine-700);
border-color:var(--pine-700);
color:#fff;
box-shadow:var(--shadow-sm)
}

/* LOADING */

.loading{
padding:30px 18px;
text-align:center;
color:var(--ink-soft);
font-size:13px
}

.spinner{
width:28px;
height:28px;
margin:0 auto 10px;
border:3px solid var(--line);
border-top-color:var(--pine-700);
border-radius:50%;
animation:spin .7s linear infinite
}

@keyframes spin{
to{
transform:rotate(360deg)
}
}

/* RAIL */

.rail{
display:flex;
gap:13px;
overflow-x:auto;
padding:2px 18px 10px
}

.city-card{
flex:0 0 auto;
width:146px;
background:#fff;
border-radius:var(--radius-md);
box-shadow:var(--shadow-sm);
overflow:hidden;
border:1px solid var(--line)
}

.city-card .thumb{
height:96px;
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
position:relative;
overflow:hidden
}

.city-card .thumb img{
width:100%;
height:100%;
object-fit:cover
}

.city-card .fav-dot{
position:absolute;
top:8px;
right:8px;
width:26px;
height:26px;
border-radius:50%;
background:rgba(255,255,255,.88);
display:flex;
align-items:center;
justify-content:center;
font-size:13px
}

.city-card .body{
padding:10px 11px 12px
}

.city-card .name{
font-weight:700;
font-size:14px;
margin-bottom:2px
}

.city-card .region{
font-size:11px;
color:var(--ink-soft)
}

/* GRID */

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
padding:2px 18px 6px
}

.place-card{
background:#fff;
border-radius:var(--radius-md);
overflow:hidden;
box-shadow:var(--shadow-sm);
border:1px solid var(--line)
}

.place-card .thumb{
height:100px;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
position:relative;
overflow:hidden
}

.place-card .thumb img{
width:100%;
height:100%;
object-fit:cover
}

.place-card .cat-tag{
position:absolute;
left:8px;
top:8px;
background:rgba(11,42,32,.62);
color:#fff;
font-size:9.5px;
font-weight:700;
letter-spacing:.04em;
text-transform:uppercase;
padding:3px 7px;
border-radius:999px
}

.place-card .body{
padding:9px 10px 11px
}

.place-card .name{
font-weight:700;
font-size:13px;
line-height:1.25;
margin-bottom:3px
}

.place-card .loc{
font-size:10.5px;
color:var(--ink-soft);
margin-bottom:6px
}

.place-card .meta{
display:flex;
align-items:center;
justify-content:space-between
}

.rating{
font-size:11.5px;
font-weight:700;
color:var(--gold-600);
display:flex;
align-items:center;
gap:3px
}

.price-tag{
font-size:11px;
font-weight:600;
color:var(--pine-700)
}

/* LIST */

.list-row{
display:flex;
gap:12px;
background:#fff;
border-radius:var(--radius-md);
border:1px solid var(--line);
box-shadow:var(--shadow-sm);
padding:10px;
margin:0 18px 12px
}

.list-row .thumb{
width:64px;
height:64px;
border-radius:12px;
flex:0 0 auto;
display:flex;
align-items:center;
justify-content:center;
font-size:26px;
overflow:hidden
}

.list-row .thumb img{
width:100%;
height:100%;
object-fit:cover
}

.list-row .info{
flex:1;
min-width:0
}

.list-row .name{
font-weight:700;
font-size:14px;
margin-bottom:2px
}

.list-row .loc{
font-size:11.5px;
color:var(--ink-soft);
margin-bottom:5px
}

/* EMPTY */

.empty-state{
padding:40px 24px;
text-align:center;
color:var(--ink-soft)
}

.empty-state .glyph{
font-size:34px;
margin-bottom:10px
}

.empty-state .txt{
font-size:13.5px;
line-height:1.5
}

/* FIREBASE STATUS */

.firebase-status{
margin:8px 18px 0;
padding:9px 12px;
border-radius:10px;
font-size:11px;
background:var(--pine-100);
color:var(--pine-700)
}

/* ADS */

.ad-slot{
margin:2px 18px 16px;
border-radius:var(--radius-md);
border:1.5px dashed var(--gold-500);
background:
linear-gradient(
135deg,
var(--gold-300),
var(--cream-2) 130%
);
padding:13px 14px;
display:flex;
align-items:center;
gap:12px
}

.ad-slot .ad-icon{
width:44px;
height:44px;
border-radius:12px;
background:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
flex:0 0 auto
}

.ad-slot .ad-body{
flex:1;
min-width:0
}

.ad-slot .ad-label{
font-size:9.5px;
font-weight:700;
letter-spacing:.1em;
text-transform:uppercase;
color:var(--gold-600)
}

.ad-slot .ad-title{
font-size:13.5px;
font-weight:700;
margin-top:2px
}

.ad-slot .ad-desc{
font-size:11.5px;
color:var(--ink-soft);
margin-top:1px
}

/* NAV */

.bottom-nav{
position:fixed;
left:0;
right:0;
bottom:0;
max-width:480px;
margin:auto;
background:rgba(251,248,242,.96);
backdrop-filter:blur(6px);
border-top:1px solid var(--line);
display:flex;
padding:
8px
6px
calc(8px + env(safe-area-inset-bottom));
z-index:40
}

.nav-btn{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
gap:3px;
padding:6px 2px;
color:var(--ink-soft);
font-size:10.5px;
font-weight:600;
position:relative
}

.nav-btn .ic{
font-size:19px
}

.nav-btn.active{
color:var(--pine-700)
}

.nav-badge{
position:absolute;
top:0;
right:22%;
min-width:15px;
height:15px;
border-radius:999px;
background:var(--danger);
color:#fff;
font-size:9px;
font-weight:700;
display:flex;
align-items:center;
justify-content:center;
padding:0 3px
}

/* PAGE */

.page-head{
padding:18px 18px 6px;
display:flex;
align-items:center;
gap:12px
}

.page-head .title{
font-family:var(--font-display);
font-size:19px;
font-weight:700
}

.search-full{
margin:10px 18px 4px
}

/* PROFILE */

.profile-hero{
padding:22px 18px 6px;
display:flex;
align-items:center;
gap:13px
}

.avatar{
width:56px;
height:56px;
border-radius:50%;
background:
linear-gradient(
145deg,
var(--gold-500),
var(--gold-600)
);
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
color:var(--pine-800)
}

.profile-name{
font-family:var(--font-display);
font-weight:700;
font-size:17px
}

.profile-sub{
font-size:12px;
color:var(--ink-soft);
margin-top:2px
}

.menu-list{
margin:14px 18px;
background:#fff;
border-radius:var(--radius-md);
border:1px solid var(--line);
overflow:hidden;
box-shadow:var(--shadow-sm)
}

.menu-item{
width:100%;
display:flex;
align-items:center;
gap:12px;
padding:14px 15px;
border-bottom:1px solid var(--line);
text-align:left
}

.menu-item:last-child{
border-bottom:0
}

.menu-item .ic{
width:34px;
height:34px;
border-radius:10px;
background:var(--pine-100);
display:flex;
align-items:center;
justify-content:center;
font-size:16px
}

.menu-item .label{
flex:1;
font-size:14px;
font-weight:600
}

.menu-item .val{
font-size:12.5px;
color:var(--ink-soft)
}

.menu-item .chev{
color:var(--ink-soft);
font-size:14px
}

.lang-row{
display:flex;
gap:10px;
margin:10px 18px 4px
}

.lang-btn{
flex:1;
padding:11px 6px;
border-radius:12px;
border:1.5px solid var(--line);
background:#fff;
font-size:12.5px;
font-weight:700
}

.lang-btn.active{
border-color:var(--pine-700);
background:var(--pine-700);
color:#fff
}

/* TRIP */

.trip-item{
display:flex;
align-items:center;
gap:12px;
background:#fff;
border:1px solid var(--line);
border-radius:var(--radius-md);
padding:11px;
margin:0 18px 10px;
box-shadow:var(--shadow-sm)
}

.trip-item .idx{
width:24px;
height:24px;
border-radius:50%;
background:var(--pine-100);
color:var(--pine-700);
font-size:12px;
font-weight:700;
display:flex;
align-items:center;
justify-content:center;
flex:0 0 auto
}

.trip-item .thumb{
width:48px;
height:48px;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
flex:0 0 auto;
overflow:hidden
}

.trip-item .thumb img{
width:100%;
height:100%;
object-fit:cover
}

.trip-item .info{
flex:1;
min-width:0
}

.trip-item .name{
font-weight:700;
font-size:13.5px
}

.trip-item .loc{
font-size:11px;
color:var(--ink-soft)
}

.trip-item .rm{
font-size:18px;
color:var(--ink-soft);
padding:4px 6px
}

.budget-card{
margin:0 18px 14px;
background:#fff;
border:1px solid var(--line);
border-radius:var(--radius-md);
padding:14px;
box-shadow:var(--shadow-sm)
}

.budget-row{
display:flex;
justify-content:space-between;
align-items:center;
font-size:14px
}

.budget-row .sum{
font-weight:700;
color:var(--pine-700);
font-size:16px
}

.btn{
display:inline-flex;
align-items:center;
justify-content:center;
gap:7px;
padding:13px 18px;
border-radius:14px;
font-weight:700;
font-size:14px
}

.btn-block{
width:calc(100% - 36px);
margin:6px 18px 18px
}

.btn-danger-ghost{
color:var(--danger);
border:1.5px solid var(--danger);
background:#fff
}

/* SHEET */

.overlay{
position:fixed;
inset:0;
background:rgba(11,42,32,.45);
display:none;
align-items:flex-end;
justify-content:center;
z-index:100
}

.overlay.open{
display:flex
}

.sheet{
width:100%;
max-width:480px;
max-height:88vh;
overflow-y:auto;
background:var(--cream);
border-radius:24px 24px 0 0;
animation:slideUp .22s ease-out;
padding-bottom:26px
}

@keyframes slideUp{
from{
transform:translateY(24px);
opacity:.4
}
to{
transform:translateY(0);
opacity:1
}
}

.sheet-grabber{
width:38px;
height:4px;
background:var(--line);
border-radius:99px;
margin:10px auto 0
}

.sheet-hero{
height:180px;
margin:14px 18px 0;
border-radius:18px;
display:flex;
align-items:center;
justify-content:center;
font-size:64px;
position:relative;
overflow:hidden
}

.sheet-hero img{
width:100%;
height:100%;
object-fit:cover
}

.sheet-close{
position:absolute;
top:10px;
right:10px;
width:32px;
height:32px;
border-radius:50%;
background:rgba(255,255,255,.85);
display:flex;
align-items:center;
justify-content:center
}

.sheet-cat{
position:absolute;
left:12px;
top:12px;
background:rgba(11,42,32,.6);
color:#fff;
font-size:10px;
font-weight:700;
text-transform:uppercase;
letter-spacing:.05em;
padding:4px 9px;
border-radius:999px
}

.sheet-body{
padding:16px 18px 0
}

.sheet-title{
font-family:var(--font-display);
font-size:22px;
font-weight:700;
margin-bottom:4px
}

.sheet-loc{
font-size:13px;
color:var(--ink-soft);
margin-bottom:12px
}

.sheet-stats{
display:flex;
gap:8px;
margin-bottom:14px
}

.stat-pill{
flex:1;
background:#fff;
border:1px solid var(--line);
border-radius:12px;
padding:9px 8px;
text-align:center
}

.stat-pill .v{
font-weight:700;
font-size:13.5px
}

.stat-pill .l{
font-size:9.5px;
color:var(--ink-soft);
text-transform:uppercase;
letter-spacing:.05em;
margin-top:1px
}

.sheet-desc{
font-size:13.5px;
line-height:1.65;
margin-bottom:14px
}

.sheet-detail-row{
display:flex;
gap:10px;
padding:10px 0;
border-top:1px solid var(--line);
font-size:13px
}

.sheet-detail-row .ic{
width:20px;
flex:0 0 auto
}

.sheet-detail-row .k{
color:var(--ink-soft);
width:82px;
flex:0 0 auto
}

.sheet-map-box{
margin-top:6px;
background:var(--pine-100);
border-radius:14px;
padding:14px;
font-size:12px;
color:var(--pine-700);
line-height:1.55;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}

.map-link{
background:var(--pine-700);
color:#fff;
padding:6px 12px;
border-radius:8px;
font-weight:700;
font-size:11px;
white-space:nowrap
}

.sheet-actions{
display:flex;
gap:9px;
padding:16px 18px 0
}

.act-btn{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
gap:4px;
padding:11px 4px;
border-radius:14px;
border:1.5px solid var(--line);
background:#fff;
font-size:10.5px;
font-weight:700;
color:var(--ink-soft)
}

.act-btn.on{
border-color:var(--gold-600);
background:var(--gold-300);
color:var(--gold-600)
}

.act-btn .ic{
font-size:18px
}

/* TOAST */

.toast{
position:fixed;
left:50%;
bottom:96px;
transform:
translateX(-50%)
translateY(20px);
background:var(--pine-800);
color:#fff;
font-size:12.5px;
font-weight:600;
padding:10px 18px;
border-radius:999px;
opacity:0;
pointer-events:none;
transition:.22s ease;
z-index:200;
max-width:80%;
text-align:center;
box-shadow:var(--shadow-lg)
}

.toast.show{
opacity:1;
transform:
translateX(-50%)
translateY(0)
}

</style>
</head>

<body>

<div id="app">

<!-- HOME -->

<div class="view active" id="view-home">

<div class="header">

<div class="header-top">

<div class="logo">

<div class="logo-mark">
S
</div>

<div class="logo-text">

SHOHIN TRAVEL

<small>
SHTJK 🇹🇯
</small>

</div>

</div>

<button
class="header-icon-btn"
data-nav="profile">
👤
</button>

</div>

<div
class="header-title"
data-i18n="homeTitle">
Путешествуй по Таджикистану 🇹🇯
</div>

<div class="search-bar">

<span class="search-icon">🔍</span>

<input
id="homeSearch"
type="text"
data-i18n-ph="searchPh"
placeholder="Город, место, категория…">

<span
class="search-clear"
id="homeSearchClear">
✕
</span>

</div>

<svg
class="ridge"
viewBox="0 0 480 64"
preserveAspectRatio="none">

<polygon
points="0,64 0,40 60,18 120,36 180,10 250,32 320,14 390,38 440,22 480,40 480,64"
fill="#1E6A48"
opacity=".55"/>

<polygon
points="0,64 0,50 70,30 140,46 210,26 280,44 350,28 420,48 480,32 480,64"
fill="#175038"
opacity=".75"/>

</svg>

/* =====================================================
NORMALIZE FIREBASE ITEM
===================================================== */

function normalizeFirebaseItem(firebaseDoc){

const data=firebaseDoc.data();

const coords=data.coords||{};

const type=
data.type||"place";

let category=
data.category||"nature";

if(
type==="city"
){
category="city";
}

if(
type==="hotel"
){
category="hotel";
}

if(
type==="restaurant"
){
category="food";
}

return{

id:"fb_"+firebaseDoc.id,

firebaseId:firebaseDoc.id,

source:"firebase",

type:type,

name:data.name||"Без названия",

city:data.city||"",

region:data.region||"Таджикистан",

country:"tj",

category:category,

description:data.description||"",

coords:{
lat:Number(coords.lat)||0,
lng:Number(coords.lng)||0
},

rating:Number(data.rating)||0,

price:data.price||"",

numCost:Number(data.numCost)||0,

hours:data.hours||"",

phone:data.phone||"",

icon:data.icon||
(
type==="hotel"
?"🏨":
type==="restaurant"
?"🍽️":
type==="city"
?"🏙️":
"🏔️"
),

/*
   ВАЖНО:
   imageName берём из Firestore.
*/

imageName:
data.imageName||
"",

/*
   Ссылка строится автоматически.
*/

imageUrl:
getImageUrl(data)

};

}

async function loadFirebasePlaces(){

const status=
document.getElementById(
"firebaseStatus"
);

try{

status.textContent=
"🔄 Загружаем объекты из Firebase...";

const snapshot=
await getDocs(
collection(db,"places")
);

FIREBASE_ITEMS=[];

snapshot.forEach(firebaseDoc=>{

const item=
normalizeFirebaseItem(
firebaseDoc
);

FIREBASE_ITEMS.push(item);

});

ALL_ITEMS=[
...CITIES,
...PLACES,
...FIREBASE_ITEMS
];

status.textContent=
"🟢 Firebase: "+
FIREBASE_ITEMS.length+
" объектов";

refreshAllViews();

}catch(error){

console.error(
"Firebase error:",
error
);

status.textContent=
"🔴 Firebase: ошибка доступа";

}

}

return state.trip.includes(id);

}

function catMeta(id){

return(
CATEGORIES.find(
c=>c.id===id
)||
CATEGORIES[0]
);

}

function itemLocLabel(item){

if(item.type==="city"){

return item.region||"Таджикистан";

}

return[
item.city,
item.region
]
.filter(Boolean)
.join(" · ");

}

function thumbBg(item,index){

const colors=[
"#E4F1EA",
"#F3D08D",
"#DDEDE3",
"#F0E2C0",
"#E9F3EC"
];

return colors[index%colors.length];

}

function escapeHtml(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
IMAGE CONTENT
===================================================== */

function thumbContent(item){

const image=
item.imageUrl||
(
item.imageName
?
GITHUB_IMAGE_BASE+
encodeURIComponent(
item.imageName.trim()
)
:
""
);

if(image){

return`

<img
src="${escapeHtml(image)}"
alt="${escapeHtml(item.name)}"
loading="lazy"
onerror="
this.style.display='none';
this.parentElement.classList.add('image-error');
"
>

`;

}

return item.icon||"📍";

}


/* =====================================================
TOAST
===================================================== */

function showToast(message){

const el=
document.getElementById("toast");

el.textContent=message;

el.classList.add("show");

clearTimeout(showToast.timer);

showToast.timer=
setTimeout(
()=>{
el.classList.remove("show");
},
1700
);

}


/* =====================================================
SEARCH
===================================================== */

function matchesQuery(item,q){

if(!q)
return true;

q=q.toLowerCase();

return[
item.name||"",
item.region||"",
item.city||"",
item.description||"",
item.category||"",
item.type||""
]
.join(" ")
.toLowerCase()
.includes(q);

}

function filterItems(){

return ALL_ITEMS.filter(item=>{

const categoryOK=
state.category==="all"||
item.category===state.category;

const queryOK=
matchesQuery(
item,
state.query.trim()
);

return categoryOK&&queryOK;

});

}

);

.querySelectorAll("[data-fav]")
.forEach(dot=>{

);

};

});

container
.querySelectorAll(".list-row")
.forEach(row=>{

row.onclick=()=>

row.dataset.id
);

});

}


/* =====================================================
FAVORITE
===================================================== */

function toggleFav(id){

if(isFav(id)){

state.favorites=
state.favorites.filter(
x=>x!==id
);

showToast(
state.lang==="tj"
?
"Аз дилхоҳ хориҷ шуд"
:
"Удалено из избранного"
);

}else{

state.favorites.push(id);

showToast(
state.lang==="tj"
?
"Ба дилхоҳ илова шуд"
:
"Добавлено в избранное"
);

}

saveFavorites();

refreshAllViews();

}

?

:
"Добавлено в поездку"
);

}

refreshAllViews();

}

/* =====================================================
TABS
===================================================== */

function setTab(tab){

state.tab=tab;

document
.querySelectorAll(".view")
.forEach(v=>
v.classList.remove("active")
);

const target=
document.getElementById(
"view-"+tab
);

if(target){

target.classList.add("active");

}

document
.querySelectorAll(".nav-btn")
.forEach(btn=>

btn.classList.toggle(
"active",
btn.dataset.tab===tab
)

);

if(tab==="search")
renderSearchResults();

if(tab==="trip")
renderTrip();

if(tab==="favorites")
renderFavorites();

window.scrollTo(0,0);

}


/* =====================================================
LANGUAGE
===================================================== */

function applyLanguage(){

document.documentElement.lang=
state.lang;

document
.querySelectorAll("[data-i18n]")
.forEach(el=>{

el.textContent=
t(el.dataset.i18n);

});

document
.querySelectorAll("[data-i18n-ph]")
.forEach(el=>{

el.placeholder=
t(el.dataset.i18nPh);

});

document
.querySelectorAll(".lang-btn")
.forEach(btn=>{

btn.classList.toggle(
"active",
btn.dataset.lang===state.lang
);

});

}


/* =====================================================
STORAGE LOCAL
===================================================== */

function saveFavorites(){

localStorage.setItem(
"shtjk_favorites_v4",
JSON.stringify(
state.favorites
)
);

}

function saveTrip(){

localStorage.setItem(
"shtjk_trip_v4",
JSON.stringify(
state.trip
)
);

}


/* =====================================================
REFRESH
===================================================== */

function refreshAllViews(){

renderCitiesRail();

renderPlacesGrid();

renderAds();

renderChips();

applyLanguage();

if(state.tab==="home"){

applyHomeFilterView();

}

if(state.tab==="search"){

renderSearchResults();

}

if(state.tab==="trip"){

renderTrip();

}

if(state.tab==="favorites"){

renderFavorites();

}

document
.getElementById("favCount")
.textContent=
state.favorites.length;

document
.getElementById("tripCount")
.textContent=
state.trip.length;

}


/* =====================================================
GLOBAL EVENTS
===================================================== */

function bindGlobalEvents(){

document
.querySelectorAll("[data-nav]")
.forEach(el=>{

el.onclick=()=>{

if(el.dataset.cat){

state.category=
el.dataset.cat;

renderChips();

}

setTab(
el.dataset.nav
);

};

});

document
.querySelectorAll(".nav-btn")
.forEach(btn=>{

btn.onclick=()=>
setTab(
btn.dataset.tab
);

});

const homeSearch=
document.getElementById(
"homeSearch"
);

homeSearch.oninput=e=>{

state.query=
e.target.value;

applyHomeFilterView();

};

document
.getElementById(
"homeSearchClear"
)
.onclick=()=>{

homeSearch.value="";

state.query="";

applyHomeFilterView();

};

const fullSearch=
document.getElementById(
"fullSearch"
);

fullSearch.oninput=e=>{

state.query=
e.target.value;

document
.getElementById(
"fullSearchClear"
)
.style.display=
e.target.value
?
"block"
:
"none";

renderSearchResults();

};

document
.getElementById(
"fullSearchClear"
)
.onclick=()=>{

fullSearch.value="";

state.query="";

renderSearchResults();

document
.getElementById(
"fullSearchClear"
)
.style.display="none";

};

document
.getElementById(
"overlay"
)
.onclick=e=>{

if(
e.target.id==="overlay"
){

document
.getElementById("overlay")
.classList
.remove("open");

}

};

document
.querySelectorAll(".lang-btn")
.forEach(btn=>{

btn.onclick=()=>{

state.lang=
btn.dataset.lang;

localStorage.setItem(
"shtjk_lang_v4",
state.lang
);

applyLanguage();

refreshAllViews();

};

});

}


/* =====================================================
START
===================================================== */

async function init(){

try{

renderChips();

renderCitiesRail();

renderPlacesGrid();

renderAds();

applyLanguage();

bindGlobalEvents();

refreshAllViews();

await loadFirebasePlaces();

}catch(error){

console.error(
"Application error:",
error
);

}

}

init();

</script>
